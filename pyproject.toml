[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "red-leaf-town-story"
version = "0.1.0"
description = "红叶镇物语的游戏核心、Web API 与 QQ 插件"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.9,<3",
  "quart>=0.19,<1",
  "redis>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = "-ra -q"
